<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f34c39"><title>Little Logic · 회로 놀이터</title><link rel="canonical" href="https://ordinaldoctrine.com/"><meta name="description" content="WIRE, NOT, OR, AND, XOR, LATCH. 버튼과 불빛으로 발견하는 회로 놀이터.">
<style>
:root{--bg:#f34c39;--ink:#222923;--title:#fff4d7;--live:#fff5a9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;transition:background .22s}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:4px solid var(--title);outline-offset:7px}main{height:100svh;min-height:280px;width:100%;position:relative;isolation:isolate;overflow:hidden;touch-action:pan-y}h1{position:absolute;left:max(7vw,env(safe-area-inset-left));top:max(5vh,env(safe-area-inset-top));margin:0;line-height:.85;font-size:clamp(56px,10vw,140px);font-weight:900;letter-spacing:-.065em;color:var(--title);pointer-events:none}#circuit{position:absolute;width:100%;height:100%;inset:0;pointer-events:none}.trace{fill:none;stroke:var(--ink);stroke-width:7;stroke-linejoin:round;stroke-linecap:round}.trace.on{stroke:var(--live);filter:drop-shadow(0 0 5px #fff5a95a)}.gate{fill:var(--bg);stroke:var(--ink);stroke-width:6;stroke-linejoin:round}.symbol{font:bold 28px Arial;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.node{position:absolute;transform:translate(-50%,-50%)}.input{width:clamp(76px,12vmin,128px);height:clamp(76px,12vmin,128px);border:8px solid #252923;border-radius:50%;background:linear-gradient(145deg,#ffe870,#f1bf13);color:#3b330e;font-weight:900;font-size:clamp(24px,3vmin,38px);box-shadow:0 7px 0 #161d17,0 12px 20px #0003;transition:box-shadow .12s,translate .12s;position:relative}.input:before{content:'';position:absolute;inset:6px;border:2px solid #fff5;border-radius:50%}.input.b{background:linear-gradient(145deg,#ff927c,#e94a37);color:#4c1f15}.input[aria-pressed=true],.input:active{translate:0 5px;box-shadow:0 2px 0 #161d17,0 0 25px #ffde8b55}.input-caption{display:block;position:absolute;top:calc(100% + 17px);width:100%;text-align:center;font-weight:bold;letter-spacing:.12em;font-size:14px}.lamp{width:clamp(62px,10vmin,110px);height:clamp(62px,10vmin,110px);padding:10px;border-radius:50%;background:#28312b;box-shadow:0 5px 0 #172018}.lamp span{display:block;width:100%;height:100%;border-radius:50%;background:#727f70;box-shadow:inset 0 4px 8px #0006;transition:background .15s,box-shadow .15s}.lamp.on span{background:#f0ffc3;box-shadow:0 0 28px #eaffac,0 0 65px #ecffaf77,inset 0 0 8px white}.nav{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:7vw;right:7vw;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.nav button,.utility button{pointer-events:auto;border:0;background:transparent;color:var(--ink);width:48px;height:48px;font-size:34px;line-height:1;border-radius:50%}.nav button:hover,.utility button:hover{background:#ffffff21}.dots{display:flex;gap:11px;pointer-events:auto}.dots button{width:24px;height:36px;display:grid;place-items:center}.dots button:after{content:'';height:7px;width:7px;border-radius:50%;background:var(--ink);opacity:.3}.dots button[aria-current=true]:after{opacity:1;box-shadow:0 0 0 3px #ffffff33}.utility{position:absolute;right:max(4vw,env(safe-area-inset-right));top:max(3vh,env(safe-area-inset-top));display:flex;gap:2px}.utility button{font-size:23px;opacity:.7}.utility #help{font-size:19px}.sr-only{position:absolute!important;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden;white-space:nowrap}dialog{max-width:min(420px,90vw);border:0;border-radius:24px;padding:28px;background:#fff9e8;color:#263026;font:16px/1.75 Arial,sans-serif;box-shadow:0 20px 90px #0005}dialog::backdrop{background:#0005;backdrop-filter:blur(5px)}dialog h2{font-size:32px;letter-spacing:-1px;margin:0}dialog button{float:right;border:0;background:none;font-size:28px;padding:2px 10px;border-radius:10px}dialog button:focus-visible{outline:3px solid #263026}dialog p{margin-bottom:0}@media(orientation:portrait){h1{top:max(72px,8vh,env(safe-area-inset-top));left:8vw;font-size:clamp(64px,18vw,110px)}.input{width:clamp(72px,20vw,112px);height:clamp(72px,20vw,112px);border-width:7px}.lamp{width:clamp(66px,18vw,100px);height:clamp(66px,18vw,100px);padding:9px}.utility{top:max(2vh,env(safe-area-inset-top));right:3vw}.utility button{width:42px;height:42px}.nav{left:6vw;right:6vw;bottom:max(20px,env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main id="board" aria-label="회로 놀이터"><h1 id="title">WIRE</h1><svg id="circuit" aria-hidden="true"></svg><div id="inputs"></div><div id="light" class="node lamp" role="img" aria-label="출력 꺼짐"><span></span></div><div class="utility"><button id="reset" aria-label="현재 회로 초기화">↻</button><button id="help" aria-label="회로 설명 열기">?</button></div><nav class="nav" aria-label="회로 이동"><button id="prev" aria-label="이전 회로">←</button><div class="dots" id="dots"></div><button id="next" aria-label="다음 회로">→</button></nav><p id="status" class="sr-only" role="status" aria-live="polite"></p></main>
<dialog id="guide"><button id="close" aria-label="설명 닫기">×</button><h2 id="guide-title"></h2><p id="description"></p><p>버튼을 눌러 입력을 바꿔보세요. 화살표나 좌우 스와이프로 다른 회로를 탐험할 수 있어요.</p></dialog>
<script>
const gates=[['WIRE','#f34c39','#fff4d7','입력을 그대로 전달해요. A를 켜면 불빛도 켜져요.'],['NOT','#35b4b0','#173c36','입력과 반대로 작동해요. A가 꺼지면 불빛은 켜져요.'],['OR','#ed6c99','#fff3db','A 또는 B가 하나라도 켜지면 불빛이 켜져요.'],['AND','#f5d84f','#29352c','A와 B가 모두 켜져야 불빛이 켜져요.'],['XOR','#79b975','#203a2b','딱 하나의 입력만 켜졌을 때 불빛이 켜져요.'],['LATCH','#303632','#f5d84f','SET은 켜진 상태를 기억하고 RESET은 기억을 지워요. 두 명령은 순서대로 적용돼요.']];
let index=0,a=false,b=false,q=false;const $=s=>document.querySelector(s);function result(){return [a,!a,a||b,a&&b,a!==b,q][index]}function trace(d,on){return `<path class="trace ${on?'on':''}" d="${d}"/>`}
function layout(){const vertical=innerHeight>innerWidth,w=vertical?400:1000,h=vertical?700:650;const one=index<2,lat=index===5;const pts=vertical?{a:[one?200:105,315],b:[295,315],g:[200,450],out:[200,560]}:{a:[170,one?350:275],b:[170,445],g:[500,350],out:[825,350]};let paths='';if(vertical){paths+=trace(one?'M200 315 V410':'M105 315 V400 H180 V410',a);if(!one)paths+=trace('M295 315 V400 H220 V410',b);paths+=trace('M200 490 V560',result());}else{paths+=trace(one?'M170 350 H440':'M170 275 H355 V325 H440',a);if(!one)paths+=trace('M170 445 H355 V375 H440',b);paths+=trace('M560 350 H825',result());}
if(index===0)paths+=trace(vertical?'M200 410 V490':'M440 350 H560',a);else{const [gx,gy]=pts.g;paths+=`<rect class="gate" x="${gx-(vertical?40:60)}" y="${gy-40}" width="${vertical?80:120}" height="80" rx="${index===3?32:15}"/><text class="symbol" x="${gx}" y="${gy+1}">${['','¬','≥1','&','=1','Q'][index]}</text>`;}
$('#circuit').setAttribute('viewBox',`0 0 ${w} ${h}`);$('#circuit').setAttribute('preserveAspectRatio','none');$('#circuit').innerHTML=paths;for(const key of ['a','b','out']){const el=key==='out'?$('#light'):document.querySelector(`[data-key="${key}"]`)?.parentElement;if(el){el.style.left=100*pts[key][0]/w+'%';el.style.top=100*pts[key][1]/h+'%';}}$('#light').classList.toggle('on',result());$('#light').setAttribute('aria-label',result()?'출력 켜짐':'출력 꺼짐');$('#status').textContent=`${gates[index][0]}: ${result()?'켜짐':'꺼짐'}`;if(!lat){document.querySelector('[data-key=a]').setAttribute('aria-pressed',String(a));document.querySelector('[data-key=b]')?.setAttribute('aria-pressed',String(b));}}
function select(n){index=(n+6)%6;a=b=q=false;const [name,color,title,desc]=gates[index];document.body.style.setProperty('--bg',color);document.body.style.setProperty('--title',title);document.body.style.setProperty('--ink',index===5?'#f5df91':'#222923');document.querySelector('meta[name=theme-color]').content=color;$('#title').textContent=name;$('#guide-title').textContent=name;$('#description').textContent=desc;$('#inputs').innerHTML=(index<2?['a']:['a','b']).map(k=>`<div class="node"><button class="input ${k==='b'?'b':''}" data-key="${k}" aria-label="${index===5?(k==='a'?'SET 기억 켜기':'RESET 기억 지우기'):k.toUpperCase()+' 입력'}" ${index===5?'':'aria-pressed="false"'}>${index===5?(k==='a'?'+':'−'):k.toUpperCase()}</button>${index===5?`<span class="input-caption">${k==='a'?'SET':'RESET'}</span>`:''}</div>`).join('');document.querySelectorAll('.input').forEach(el=>el.onclick=()=>{if(index===5)q=el.dataset.key==='a';else if(el.dataset.key==='a')a=!a;else b=!b;layout()});document.querySelectorAll('.dots button').forEach((el,i)=>el.setAttribute('aria-current',String(i===index)));layout()}
$('#dots').innerHTML=gates.map((g,i)=>`<button aria-label="${g[0]} 회로" data-index="${i}"></button>`).join('');document.querySelectorAll('.dots button').forEach(el=>el.onclick=()=>select(+el.dataset.index));$('#prev').onclick=()=>select(index-1);$('#next').onclick=()=>select(index+1);$('#reset').onclick=()=>select(index);$('#help').onclick=()=>$('#guide').showModal();$('#close').onclick=()=>$('#guide').close();$('#guide').addEventListener('click',e=>{if(e.target===$('#guide')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});window.addEventListener('resize',layout);document.addEventListener('keydown',e=>{if($('#guide').open)return;if(e.key==='ArrowRight'){e.preventDefault();select(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();select(index-1)}});let start=null;$('#board').addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!e.target.closest('button'))start={x:e.clientX,y:e.clientY}});$('#board').addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)select(index+(dx<0?1:-1))});$('#board').addEventListener('pointercancel',()=>start=null);select(0);
</script></body></html>
